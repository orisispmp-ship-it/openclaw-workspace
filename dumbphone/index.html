<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="바보폰">
  <link rel="manifest" href="manifest.json">
  <title>바보폰</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    @font-face {
      font-family: 'DungGeunMo';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, 'DungGeunMo', 'Courier New', monospace;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* ======== LOCK SCREEN ======== */
    #lockScreen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    #lockScreen.hidden {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }
    #lockScreen .time {
      font-size: 72px;
      font-weight: 200;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }
    #lockScreen .date {
      font-size: 20px;
      font-weight: 300;
      color: #888;
      margin-bottom: 60px;
    }
    #lockScreen .swipe-hint {
      font-size: 14px;
      color: #444;
      animation: fadePulse 2s ease-in-out infinite;
    }
    @keyframes fadePulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }

    /* ======== MAIN LAYOUT ======== */
    #main {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #111;
    }

    /* Status Bar */
    #statusBar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px 6px;
      font-size: 13px;
      color: #aaa;
      background: #111;
      flex-shrink: 0;
    }
    #statusBar .battery {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #statusBar .battery::after {
      content: '';

    }

    /* Header - Clock */
    #header {
      text-align: center;
      padding: 20px 20px 10px;
      flex-shrink: 0;
    }
    #header .time {
      font-size: 56px;
      font-weight: 200;
      letter-spacing: 2px;
      color: #fff;
    }
    #header .date {
      font-size: 16px;
      color: #666;
      margin-top: 2px;
    }

    /* App Grid */
    #appGrid {
      display: flex;
      justify-content: center;
      gap: 24px;
      padding: 30px 20px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .app-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 72px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .app-icon .circle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      transition: transform 0.15s, background 0.2s;
    }
    .app-icon:active .circle {
      transform: scale(0.88);
    }
    .app-icon .label {
      font-size: 11px;
      color: #999;
      text-align: center;
      letter-spacing: 1px;
    }

    .app-icon.phone .circle   { background: #2e7d32; }
    .app-icon.msg .circle     { background: #1565c0; }
    .app-icon.camera .circle  { background: #555; }
    .app-icon.gallery .circle { background: #4a148c; }
    .app-icon.music .circle   { background: #e65100; }
    .app-icon.weather .circle { background: #00838f; }
    .app-icon.map .circle     { background: #37474f; }
    .app-icon.setting .circle { background: #333; }

    /* Quick Dial Pad */
    #dialPad {
      padding: 8px 30px 4px;
      flex-shrink: 0;
    }
    #dialPad .number {
      text-align: center;
      font-size: 32px;
      letter-spacing: 4px;
      color: #0f0;
      min-height: 40px;
      font-family: 'Courier New', monospace;
    }
    #dialPad .row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 6px;
    }
    #dialPad .key {
      width: 56px;
      height: 44px;
      border-radius: 8px;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #ddd;
      cursor: pointer;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    #dialPad .key:active {
      background: #444;
    }
    #dialPad .key.call {
      background: #2e7d32;
      color: #fff;
      font-size: 20px;
    }
    #dialPad .key.call:active {
      background: #1b5e20;
    }

    /* Recent Notifications Area */
    #notifArea {
      flex: 1;
      padding: 10px 30px 20px;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    #notifArea::-webkit-scrollbar { display: none; }
    #notifArea .empty {
      text-align: center;
      color: #333;
      font-size: 13px;
      margin-top: 16px;
      letter-spacing: 0.5px;
    }
    .notif-item {
      background: #1a1a1a;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }
    .notif-item .emoji { font-size: 18px; }
    .notif-item .text { color: #aaa; flex: 1; }
    .notif-item .time { color: #555; font-size: 11px; }

    /* Bottom Nav */
    #bottomNav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 20px;
      background: #0a0a0a;
      border-top: 1px solid #222;
      flex-shrink: 0;
    }
    #bottomNav .nav-btn {
      font-size: 12px;
      color: #666;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.2s;
    }
    #bottomNav .nav-btn.active { color: #0f0; }
    #bottomNav .nav-btn .icon { font-size: 18px; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      background: #1a1a1a;
      border-radius: 16px;
      padding: 28px 24px;
      width: 300px;
      max-width: 85vw;
      text-align: center;
    }
    .modal-box .title {
      font-size: 20px;
      margin-bottom: 8px;
      color: #fff;
    }
    .modal-box .desc {
      font-size: 14px;
      color: #888;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .modal-box .btn {
      display: inline-block;
      padding: 10px 32px;
      border-radius: 8px;
      background: #333;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s;
      border: none;
      font-family: inherit;
    }
    .modal-box .btn:active { background: #555; }
    .modal-box .btn.primary { background: #2e7d32; }
    .modal-box .btn.primary:active { background: #1b5e20; }

    /* Scrollable for settings */
    #settingsPanel {
      text-align: left;
    }
    #settingsPanel .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #222;
      color: #ccc;
      font-size: 14px;
    }
    #settingsPanel .row .toggle {
      width: 36px;
      height: 20px;
      border-radius: 10px;
      background: #444;
      transition: background 0.2s;
      cursor: pointer;
      position: relative;
    }
    #settingsPanel .row .toggle.on {
      background: #2e7d32;
    }
    #settingsPanel .row .toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s;
    }
    #settingsPanel .row .toggle.on::after {
      transform: translateX(16px);
    }

    /* Greyscale mode */
    body.greyscale #main {
      filter: grayscale(100%);
    }
  </style>
</head>
<body>

<!-- ======== LOCK SCREEN ======== -->
<div id="lockScreen">
  <div class="time" id="lockTime">12:00</div>
  <div class="date" id="lockDate">0000년 0월 0일</div>
  <div class="swipe-hint">← 밀어서 잠금 해제</div>
</div>

<!-- ======== MAIN ======== -->
<div id="main">
  <!-- Status Bar -->
  <div id="statusBar">
    <span id="statusCarrier">갤럭시</span>
    <span id="statusTime">12:00</span>
  </div>

  <!-- Header -->
  <div id="header">
    <div class="time" id="mainTime">12:00</div>
    <div class="date" id="mainDate">0000.0.0 (월)</div>
  </div>

  <!-- App Grid -->
  <div id="appGrid">
    <div class="app-icon phone" data-app="phone">
      <div class="circle">📞</div>
      <span class="label">전화</span>
    </div>
    <div class="app-icon msg" data-app="msg">
      <div class="circle">✉️</div>
      <span class="label">메시지</span>
    </div>
    <div class="app-icon camera" data-app="camera">
      <div class="circle">📷</div>
      <span class="label">카메라</span>
    </div>
    <div class="app-icon gallery" data-app="gallery">
      <div class="circle">🖼️</div>
      <span class="label">갤러리</span>
    </div>
    <div class="app-icon music" data-app="music">
      <div class="circle">🎵</div>
      <span class="label">음악</span>
    </div>
    <div class="app-icon weather" data-app="weather">
      <div class="circle">🌤️</div>
      <span class="label">날씨</span>
    </div>
    <div class="app-icon map" data-app="map">
      <div class="circle">📍</div>
      <span class="label">지도</span>
    </div>
    <div class="app-icon setting" data-app="setting">
      <div class="circle">⚙️</div>
      <span class="label">설정</span>
    </div>
  </div>

  <!-- Dial Pad -->
  <div id="dialPad">
    <div class="number" id="dialNumber">&nbsp;</div>
    <div class="row">
      <div class="key" data-dial="1">1</div>
      <div class="key" data-dial="2">2</div>
      <div class="key" data-dial="3">3</div>
    </div>
    <div class="row">
      <div class="key" data-dial="4">4</div>
      <div class="key" data-dial="5">5</div>
      <div class="key" data-dial="6">6</div>
    </div>
    <div class="row">
      <div class="key" data-dial="7">7</div>
      <div class="key" data-dial="8">8</div>
      <div class="key" data-dial="9">9</div>
    </div>
    <div class="row">
      <div class="key" data-dial="*">*</div>
      <div class="key" data-dial="0">0</div>
      <div class="key" data-dial="#">#</div>
    </div>
    <div class="row">
      <div class="key" data-dial="del">⌫</div>
      <div class="key call" data-dial="call">📞</div>
    </div>
  </div>

  <!-- Notifications -->
  <div id="notifArea">
    <div class="empty">— 새 알림 없음 —</div>
  </div>

  <!-- Bottom Nav -->
  <div id="bottomNav">
    <div class="nav-btn active" data-tab="home"><span class="icon">🏠</span>홈</div>
    <div class="nav-btn" data-tab="recents"><span class="icon">🕐</span>최근</div>
    <div class="nav-btn" data-tab="contacts"><span class="icon">👤</span>연락처</div>
  </div>
</div>

<!-- ======== MODAL ======== -->
<div class="modal-overlay" id="modal">
  <div class="modal-box" id="modalContent">
    <div class="title" id="modalTitle">앱</div>
    <div class="desc" id="modalDesc">이 기능은 바보폰 모드에서 제한됩니다.</div>
    <button class="btn primary" id="modalBtn">돌아가기</button>
  </div>
</div>

<script>
// ======== TIME ========
function pad(n) { return String(n).padStart(2, '0'); }

function updateClock() {
  const now = new Date();
  const hh = pad(now.getHours());
  const mm = pad(now.getMinutes());
  const str = `${hh}:${mm}`;
  document.getElementById('lockTime').textContent = str;
  document.getElementById('mainTime').textContent = str;
  document.getElementById('statusTime').textContent = str;

  const days = ['일','월','화','수','목','금','토'];
  const y = now.getFullYear();
  const m = now.getMonth() + 1;
  const d = now.getDate();
  const dow = days[now.getDay()];
  document.getElementById('lockDate').textContent = `${y}년 ${m}월 ${d}일`;
  document.getElementById('mainDate').textContent = `${y}.${m}.${d} (${dow})`;
}
updateClock();
setInterval(updateClock, 10000);

// ======== LOCK SCREEN ========
const lockScreen = document.getElementById('lockScreen');
let lockTimer = null;
let unlockStartX = 0;

lockScreen.addEventListener('touchstart', (e) => {
  unlockStartX = e.touches[0].clientX;
});

lockScreen.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - unlockStartX;
  if (dx > 80) unlock();
});

lockScreen.addEventListener('mousedown', (e) => {
  unlockStartX = e.clientX;
});
lockScreen.addEventListener('mouseup', (e) => {
  const dx = e.clientX - unlockStartX;
  if (dx > 80) unlock();
});

function unlock() {
  lockScreen.classList.add('hidden');
  if (lockTimer) clearTimeout(lockTimer);
}

function lockAfter(ms) {
  if (lockTimer) clearTimeout(lockTimer);
  lockTimer = setTimeout(() => {
    lockScreen.classList.remove('hidden');
  }, ms);
}

// Auto-lock after 60s of inactivity
let inactivityTimer = null;
function resetInactivity() {
  if (inactivityTimer) clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(() => {
    if (!lockScreen.classList.contains('hidden')) return;
    lockAfter(0);
  }, 60000);
}
document.addEventListener('touchstart', resetInactivity);
document.addEventListener('click', resetInactivity);
resetInactivity();

// ======== DIAL PAD ========
let dialNumber = '';
const dialDisplay = document.getElementById('dialNumber');

document.querySelectorAll('.key[data-dial]').forEach(key => {
  key.addEventListener('click', () => {
    const v = key.dataset.dial;
    if (v === 'del') {
      dialNumber = dialNumber.slice(0, -1);
    } else if (v === 'call') {
      if (dialNumber.length > 0) {
        showModal('📞 통화', `"${dialNumber}" 번으로 전화를 겁니다.\n(실제 통화는 되지 않는 데모입니다)`);
      }
      return;
    } else {
      dialNumber += v;
    }
    dialDisplay.textContent = dialNumber || '\u00A0';
  });
});

// ======== APPS ========
const appNames = {
  phone: '📞 전화',
  msg: '✉️ 메시지',
  camera: '📷 카메라',
  gallery: '🖼️ 갤러리',
  music: '🎵 음악',
  weather: '🌤️ 날씨',
  map: '📍 지도',
  setting: '⚙️ 설정'
};
const appDescs = {
  phone: '단축 다이얼 1: 엄마\n단축 다이얼 2: 아빠\n그 외엔 키패드로 직접 누르세요.',
  msg: '미리 저장된 메시지만 보낼 수 있습니다.\n"도착했어", "곧 갈게", "밥 먹자"',
  camera: '찰칵 — 사진 한 장.\n필터 없음. 편집 없음. 그냥 사진.',
  gallery: '오직 지난 24시간의 사진만.\n오래된 사진은 자동 삭제됩니다.',
  music: '재생 · 일시정지 · 다음 곡\n음악은 백그라운드에서만 재생됩니다.',
  weather: '"오늘 비 옴", "맑음", "흐림"\n이 세 가지만 알려드립니다.',
  map: '현재 위치에서 집까지의 거리만 표시됩니다.',
  setting: '흑백 모드 · 폰트 크기 · 알림 설정\n최소한의 설정만 가능합니다.'
};

document.querySelectorAll('.app-icon').forEach(icon => {
  icon.addEventListener('click', () => {
    const app = icon.dataset.app;
    if (app === 'setting') {
      showSettings();
    } else {
      showModal(appNames[app] || app, appDescs[app] || '준비 중입니다.');
    }
  });
});

// ======== BOTTOM NAV ========
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    if (tab === 'home') {
      // already home
    } else if (tab === 'recents') {
      showModal('🕐 최근 기록', '통화 기록:\n- 엄마 5분 전\n- 아빠 2시간 전\n- 곽두팔 3일 전');
    } else if (tab === 'contacts') {
      showModal('👤 연락처', '단축 다이얼 1: 엄마\n단축 다이얼 2: 아빠\n단축 다이얼 3: 곽두팔');
    }
  });
});

// ======== SETTINGS PANEL ========
function showSettings() {
  const modal = document.getElementById('modal');
  const content = document.getElementById('modalContent');
  content.innerHTML = `
    <div id="settingsPanel">
      <div class="row">
        <span>📵 흑백 모드</span>
        <div class="toggle ${document.body.classList.contains('greyscale') ? 'on' : ''}" id="togGreyscale"></div>
      </div>
      <div class="row">
        <span>🔕 알림 없음</span>
        <div class="toggle on" id="togNotif"></div>
      </div>
      <div class="row">
        <span>📱 폰트 크게</span>
        <div class="toggle" id="togFont"></div>
      </div>
      <div class="row">
        <span>🪫 배터리 절약</span>
        <div class="toggle on" id="togBattery"></div>
      </div>
      <div class="row" style="border:none;">
        <span>📄 버전</span>
        <span style="color:#555;">바보폰 v1.0</span>
      </div>
    </div>
    <button class="btn primary" style="margin-top:16px;">돌아가기</button>
  `;
  modal.classList.add('show');

  // Toggle handlers
  document.getElementById('togGreyscale').addEventListener('click', function() {
    this.classList.toggle('on');
    document.body.classList.toggle('greyscale');
  });
  document.getElementById('togNotif').addEventListener('click', function() {
    this.classList.toggle('on');
  });
  document.getElementById('togFont').addEventListener('click', function() {
    this.classList.toggle('on');
    document.getElementById('main').style.fontSize = this.classList.contains('on') ? '18px' : '';
  });
  document.getElementById('togBattery').addEventListener('click', function() {
    this.classList.toggle('on');
  });

  content.querySelector('.btn').addEventListener('click', closeModal);
}

// ======== MODAL ========
function showModal(title, desc) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalDesc').textContent = desc;
  document.getElementById('modalContent').innerHTML = `
    <div class="title" id="modalTitle">${title}</div>
    <div class="desc" id="modalDesc" style="white-space:pre-line;">${desc}</div>
    <button class="btn primary" id="modalBtn">돌아가기</button>
  `;
  document.getElementById('modal').classList.add('show');
  document.getElementById('modalBtn').addEventListener('click', closeModal);
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal')) closeModal();
});

// ======== SAMPLE NOTIFICATIONS ========
function addNotif(emoji, text, time) {
  const area = document.getElementById('notifArea');
  const empty = area.querySelector('.empty');
  if (empty) empty.remove();
  const item = document.createElement('div');
  item.className = 'notif-item';
  item.innerHTML = `<span class="emoji">${emoji}</span><span class="text">${text}</span><span class="time">${time}</span>`;
  area.appendChild(item);
}
addNotif('📞', '엄마 부재중 전화', '10분 전');
addNotif('☀️', '오늘 날씨: 맑음 28°C', '30분 전');

console.log('📵 바보폰 — 디지털 다이어트 시작!');
</script>
</body>
</html>
